[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikari-hopper"
version = "0.1.0"
description = "A GTA V RPF Explorer built with PySide6 and FiveFury"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "fivefury>=0.4.20,<0.5",
  "texfury @ https://github.com/Hancapo/texfury/releases/download/v1.6.3/texfury-1.6.3-py3-none-any.whl#sha256=6848fdbc0be90de3e7a66b9f9b988fa5b27a52bc3514346dc47b9e4c6b3c36cb",
]

[project.scripts]
hikari-hopper = "rpf_explorer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpf_explorer = ["ui/*.qml", "ui/*.qss", "ui/*.js", "ui/*.txt", "ui/fonts/*", "ui/theme/*.qml", "ui/theme/qmldir"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
